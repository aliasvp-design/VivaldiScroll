
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
     - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: VivaldiScroll
        run: gradle --no-daemon :app:assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VivaldiScroll-APK
          path: VivaldiScroll/app/build/outputs/apk/debug/app-debug.apk
